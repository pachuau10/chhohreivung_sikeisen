{% extends 'core/base.html' %}
{% block title %}Authentication Error - Chhohreivung{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="bg-danger bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width:64px;height:64px">
                        <i class="bi bi-exclamation-triangle fs-2 text-danger"></i>
                    </div>
                    <h5 class="fw-bold">Authentication Error</h5>
                    <p class="text-muted small mb-4">Something went wrong while trying to sign in with your third-party account. Please try again.</p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary rounded-pill px-4">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
