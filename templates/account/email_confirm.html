{% extends 'core/base.html' %}
{% block title %}Confirm Email - Chhohreivung{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm text-center animate-scale">
                <div class="card-body p-5">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 72px; height: 72px;">
                        <i class="bi bi-shield-check fs-1 text-primary"></i>
                    </div>
                    <h4 class="fw-bold">Confirm Email</h4>
                    <p class="text-muted small">Please confirm that <strong>{{ email }}</strong> is your email address.</p>
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary">Confirm</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
