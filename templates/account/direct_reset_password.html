{% extends 'core/base.html' %}
{% block title %}Reset Password - Chhohreivung{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm animate-scale">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 64px; height: 64px;">
                            <i class="bi bi-shield-lock fs-2 text-primary"></i>
                        </div>
                        <h4 class="fw-bold">Reset Password</h4>
                        <p class="text-muted small">Enter your email and new password.</p>
                    </div>
                    {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ email }}" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">New Password</label>
                            <input type="password" name="password" class="form-control" placeholder="New password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Confirm Password</label>
                            <input type="password" name="password2" class="form-control" placeholder="Confirm new password" required>
                        </div>
                        <div class="d-grid"><button type="submit" class="btn btn-primary">Reset Password</button></div>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'account_login' %}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
