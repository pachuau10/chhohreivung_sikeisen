{% extends 'core/base.html' %}
{% block title %}Reset Password - Chhohreivung{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm animate-scale">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 64px; height: 64px;">
                            <i class="bi bi-shield-lock fs-2 text-primary"></i>
                        </div>
                        <h4 class="fw-bold">Reset Password</h4>
                        <p class="text-muted small">Enter your email and we'll send you a reset link.</p>
                    </div>
                    <form method="post" action="{% url 'account_reset_password' %}">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-medium small">{{ field.label }}</label>
                            {{ field }}
                        </div>
                        {% endfor %}
                        <div class="d-grid"><button type="submit" class="btn btn-primary">Send Reset Link</button></div>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'account_login' %}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
