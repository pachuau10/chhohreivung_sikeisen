{% extends 'core/base.html' %}
{% block title %}Password Reset Complete - Chhohreivung{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm animate-scale text-center">
                <div class="card-body p-5">
                    <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 72px; height: 72px;">
                        <i class="bi bi-check-circle fs-1 text-success"></i>
                    </div>
                    <h4 class="fw-bold">Password Changed</h4>
                    <p class="text-muted small">Your password has been set successfully.</p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary mt-2">Login Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
