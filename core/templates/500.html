{% extends 'core/base.html' %}
{% block title %}Server Error - Chhohreivung{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="min-height:60vh;display:flex;align-items:center;justify-content:center">
    <div>
        <div class="mx-auto rounded-circle d-flex align-items-center justify-content-center mb-4" style="width:96px;height:96px;background:#FEF2F2">
            <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
        </div>
        <h3 class="fw-bold mb-2">Something Went Wrong</h3>
        <p class="text-muted mb-4" style="max-width:400px;margin:0 auto">An unexpected error occurred. Our team has been notified.</p>
        <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4"><i class="bi bi-house me-1"></i>Go Home</a>
    </div>
</div>
{% endblock %}
